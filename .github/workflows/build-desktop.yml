name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Build for Linux
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build Linux AppImage
        run: npm run electron:build:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v3
        with:
          name: linux-appimage
          path: |
            release/*.AppImage
            release/latest-linux.yml

  # Build for macOS
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build macOS DMG
        run: npm run electron:build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v3
        with:
          name: macos-dmg
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml

  # Build for Windows
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run electron:build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v3
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/latest.yml

  # Create GitHub Release with all artifacts
  release:
    needs: [build-linux, build-mac, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download Linux artifacts
        uses: actions/download-artifact@v3
        with:
          name: linux-appimage
          path: release-linux

      - name: Download macOS artifacts
        uses: actions/download-artifact@v3
        with:
          name: macos-dmg
          path: release-mac

      - name: Download Windows artifacts
        uses: actions/download-artifact@v3
        with:
          name: windows-installer
          path: release-windows

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Visionary OS ${{ github.ref_name }}
          body: |
            # 🎵 Visionary OS ${{ github.ref_name }}

            Your complete music empire operating system is here!

            ## ✨ What's Included

            ### 4 Business Quadrants
            - 🎵 Music Business (Red Vision Music, catalog, licensing)
            - 🎨 Lifestyle Branding (#4429, GiFTD N' PrVLGD merch)
            - 📈 Marketing & Distribution (multi-platform automation)
            - 📊 Analytics & Insights (real-time tracking)

            ### Premium Features
            - 🤖 Gemini 2.0 multimodal AI (voice + vision + thinking)
            - 🦞 Moltbot control via WhatsApp/Telegram
            - 🔄 Auto-updates (always up-to-date)
            - 💻 Native desktop app (offline mode)
            - 🎨 Professional UI with dark theme
            - 📊 Real-time analytics dashboard

            ## 📥 Download

            **macOS:**
            - Intel Mac: `Visionary OS-${{ github.ref_name }}-x64.dmg`
            - Apple Silicon: `Visionary OS-${{ github.ref_name }}-arm64.dmg`

            **Windows:**
            - Installer: `Visionary OS-${{ github.ref_name }}-x64.exe`
            - Portable: `Visionary OS-${{ github.ref_name }}-x64-portable.exe`

            **Linux:**
            - AppImage: `Visionary OS-${{ github.ref_name }}-x86_64.AppImage`

            ## 🚀 Installation

            ### macOS:
            1. Download the appropriate DMG for your Mac
            2. Open the DMG file
            3. Drag Visionary OS to Applications folder
            4. Launch from Applications!

            ### Windows:
            1. Download the installer
            2. Run the .exe file
            3. Follow the installation wizard
            4. Launch from Start Menu or Desktop!

            ### Linux:
            ```bash
            chmod +x Visionary-OS-${{ github.ref_name }}-x86_64.AppImage
            ./Visionary-OS-${{ github.ref_name }}-x86_64.AppImage
            ```

            ## 🎯 System Requirements

            - **OS:** Windows 10+, macOS 10.15+, Linux (x64)
            - **RAM:** 4GB minimum, 8GB recommended
            - **Disk:** 500MB free space
            - **Internet:** Required for initial setup and AI features

            ## 💎 Pricing

            - **Web Starter:** $29/month
            - **Desktop Pro:** $99 one-time
            - **Enterprise:** $499/month

            ---

            Built by Jason @ Red Vision Music
            Powered by Claude AI (Anthropic)
          files: |
            release-linux/*
            release-mac/*
            release-windows/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
